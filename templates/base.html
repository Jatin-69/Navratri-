<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navratri Distribution</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <nav class="p-3 bg-white shadow flex justify-between">
    <a href="/">Navratri</a>
    {% if user.is_authenticated %}<a href="{% url 'logout' %}">Logout</a>{% endif %}
  </nav>
  <main class="max-w-4xl mx-auto p-4">
    {% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
