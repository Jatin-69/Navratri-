{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h1 class="text-lg font-semibold mb-2">Event Configuration</h1>
  {% if has_claims %}<p class="mb-3 text-amber-700">Warning: claims already exist.</p>{% endif %}
  <form method="post" class="space-y-3">{% csrf_token %}{{ form.as_p }}<button class="bg-blue-600 text-white px-4 py-2 rounded">Save</button></form>
</div>
{% endblock %}
