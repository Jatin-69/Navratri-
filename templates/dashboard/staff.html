{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 rounded shadow text-center">
  <h1 class="text-2xl font-bold mb-2">Welcome, {{ request.user.get_username }}</h1>
  <p class="mb-4">Today's Distribution{% if day_number %} - Day {{ day_number }}{% endif %}</p>
  <p class="mb-4">Collected: {{ collected }}</p>
  <a href="{% url 'scanner:page' %}" class="inline-block px-6 py-3 rounded bg-blue-600 text-white text-lg">SCAN QR</a>
</div>
{% endblock %}
